<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles/styles.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="icon"
    href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtXHM7GOuoglj0_Vp5DhiisIh1G6Y2kkdHp1iWSGh3cy0htdg91BptrzyV&s=10" />
  <title>Gymshark</title>
</head>

<body>
  <header class="header-flex">
    <div class="logo-contenedor">
      <img class="logo-web"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtXHM7GOuoglj0_Vp5DhiisIh1G6Y2kkdHp1iWSGh3cy0htdg91BptrzyV&s=10" />
    </div>

    <div class="barra-busqueda">
      <input placeholder="Buscar productos..." type="search" class="input" />
    </div>
  </header>

  <main class="imagenes-grid">
    <section class="cada-imagen">
      <img
        src="https://cdn.shopify.com/s/files/1/1367/5201/files/images-PowerOriginalsCutOffTankCharcoalCoreMarlA4B9U_GBBB_5486_Acopy_1920x.jpg?v=1755156763"
        alt="">
      <p class="precio"> 20,49€ </p>
      <p class="nombre-prenda"> Camiseta Oversize </p>
    </section>
    <section class="cada-imagen">
      <img
        src="https://cdn.shopify.com/s/files/1/1367/5201/files/images-ConditioningClubOversizedT_ShirtGSBlackA2B5Y_BB2J_0624_5ec23003-ffba-4e9a-883e-3245df23962d_1920x.jpg?v=1754471851"
        alt="">
      <p class="precio"> 10,99€ </p>
      <p class="nombre-prenda"> Camiseta Oversize </p>
    </section>
    <section class="cada-imagen">
      <img
        src="https://cdn.shopify.com/s/files/1/1367/5201/files/images-PowerOriginalsCrewGSBlackGSAsphaltGreyA4B9R_BCYL_0386_1920x.jpg?v=1755115475"
        alt="">
      <p class="precio"> 6,90€ </p>
      <p class="nombre-prenda"> Camiseta Oversize </p>
    </section>
    <section class="cada-imagen">
      <img
        src="https://cdn.shopify.com/s/files/1/1367/5201/files/images-PowerOriginalsJoggerCharcoalCoreMarlA4B9P_GBBB_0665copy_1920x.jpg?v=1755160159"
        alt="">
      <p class="precio"> 156,00€ </p>
      <p class="nombre-prenda"> Camiseta Oversize </p>
    </section>
    <section class="cada-imagen">
      <img
        src="https://cdn.shopify.com/s/files/1/1367/5201/files/images-RestDayRetroCollegiatePulloverBROSSoftGreyMarlA4C3V_GC3C_0287_V2_640x.jpg?v=1776972293"
        alt="">
      <p class="precio"> 45,00€ </p>
      <p class="nombre-prenda"> Camiseta Oversize </p>
    </section>
    <section class="cada-imagen">
      <img
        src="https://cdn.shopify.com/s/files/1/1367/5201/files/images-VitalSeamlessT_ShirtGSBlack_GSSetsRedA2B5P_RB30_0830_640x.jpg?v=1750094979"
        alt="">
      <p class="precio"> 19,99€ </p>
      <p class="nombre-prenda"> Camiseta Oversize </p>
    </section>
  </main>

  <footer class="seccion-formulario">
    <form class="formulario">
      <fieldset>
        <legend>Ayúdanos a mejorar</legend>

        <label for="nombre">¿Cuál es tu nombre?</label>
        <input type="text" id="nombre" class="campo-texto" placeholder="Tu nombre..." />

        <label for="opinion">¿Qué te ha parecido la página web?</label>
        <textarea id="opinion" class="campo-texto" rows="3" placeholder="Tu opinión..."></textarea>

        <p class="pregunta-check">¿Asistes habitualmente al gym?</p>
        <div class="grupo-checks">
          <label><input class="input-selecion" type="radio" name="gym" value="no" />
            No</label>
          <label><input class="input-selecion" type="radio" name="gym" value="si" />
            Sí</label>
        </div>
        <div class="btn-formulario">
          <button class="boton-interactivo" type="button">Enviar</button>
          <button class="boton-borrar-interactivo" type="button">
            Borrar
          </button>
        </div>
      </fieldset>
    </form>
  </footer>

  <script src="./src/index.js"></script>
  
</body>

</html>
